<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>City Metro | BrickPass Cards</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>

<body>
<div class="card">
  <h1>City Metro</h1>
  <p class="subtitle">Official BrickPass Cards</p>

  <!-- STEP 1: Purchase Form -->
  <form id="ticketForm">
    <label>Ticket Type</label>
    <select id="ticket" required>
      <option>Single Ride — $1.25</option>
      <option>Day Pass — $5.00</option>
      <option>Week Pass — $18.00</option>
    </select>

    <label>Name</label>
    <input id="name" required>

    <label>Email</label>
    <input id="email" type="email" required>

    <h3>Payment (Simulation)</h3>
    <input placeholder="Card Number (Demo)" required>
    <input placeholder="MM / YY" required>
    <input placeholder="CVC" required>

    <button type="submit">Continue</button>
    <p class="fine">Simulated payment only</p>
  </form>

  <!-- STEP 2: Confirm Purchase -->
  <div id="confirm" hidden>
    <h2>Confirm Purchase</h2>
    <p><strong>Ticket:</strong> <span id="cTicket"></span></p>
    <p><strong>Name:</strong> <span id="cName"></span></p>
    <p><strong>Email:</strong> <span id="cEmail"></span></p>
    <button id="confirmBtn">Confirm & Issue Ticket</button>
  </div>

  <!-- STEP 3: Success Page -->
  <div id="success" hidden>
    <h2>Ticket Issued ✅</h2>
    <div>
      <canvas id="qr" width="220" height="220" style="border:2px solid #0a1f44; border-radius:8px;"></canvas>
    </div>
    <p>Your ticket has been emailed.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
