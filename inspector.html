<!DOCTYPE html>
<html>
<head>
  <title>City Metro | Inspector</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    body {
      background:#0a1f44;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }
    input, button { padding:10px; width:260px; margin-top:10px; }
    video { width:100%; max-width:360px; margin-top:20px; }
    .box { background:white; color:#0a1f44; padding:15px; margin-top:15px; }
  </style>
</head>

<body>
<h1>City Metro Staff</h1>

<div id="login">
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="scanner" hidden>
  <h2>Fare Inspection</h2>
  <video id="video" autoplay></video>
  <div id="result" class="box" hidden></div>
</div>

<script src="inspector.js"></script>
</body>
</html>
