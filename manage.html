<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Metro | Manage BrickPass</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>
<body>
<div class="card">
  <h1>City Metro | Manage BrickPass</h1>

  <h2>Recharge BrickPass</h2>
  <form id="rechargeForm">
    <label>BrickPass ID:</label>
    <input id="rechargeId" required>
    <label>Add Singles:</label>
    <input id="addSingles" type="number" min="0" value="0">
    <label>Add Day Passes:</label>
    <input id="addDay" type="number" min="0" value="0">
    <label>Add Week Passes:</label>
    <input id="addWeek" type="number" min="0" value="0">
    <button type="submit">Recharge</button>
  </form>

  <h2>Ticket QR</h2>
  <canvas id="qrCanvas" width="220" height="220" style="border:2px solid #0a1f44; border-radius:8px;"></canvas>
</div>

<script>
const form = document.getElementById("rechargeForm");
const qrCanvas = document.getElementById("qrCanvas");

form.addEventListener("submit", e => {
  e.preventDefault();
  const id = document.getElementById("rechargeId").value.trim();
  const ticket = JSON.parse(localStorage.getItem(id));
  if(!ticket){ alert("Ticket not found!"); return; }

  ticket.singles += parseInt(document.getElementById("addSingles").value)||0;
  ticket.dayPasses += parseInt(document.getElementById("addDay").value)||0;
  ticket.weekPasses += parseInt(document.getElementById("addWeek").value)||0;

  // Save updated ticket
  localStorage.setItem(ticket.id, JSON.stringify(ticket));
  alert("Ticket recharged!");

  // Generate QR code (ticket ID)
  new QRious({
    element: qrCanvas,
    value: ticket.id,
    size: 220
  });
});
</script>
</body>
</html>
